services:
  - type: web
    name: luma-motos-api
    runtime: node
    # DB (Neon) lives in us-east-2 (Ohio). Keeping the web service in the
    # same region avoids paying cross-region round-trip latency on every
    # one of the several sequential DB calls a single request makes.
    region: ohio
    buildCommand: npm ci --include=dev && npm run render:build
    preDeployCommand: npm run prisma:migrate:deploy && npm run prisma:seed
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_SESSION_IDLE_TIMEOUT_SECONDS
        value: 3600
      - key: PRISMA_TRANSACTION_MAX_WAIT_MS
        value: 10000
      - key: PRISMA_TRANSACTION_TIMEOUT_MS
        value: 30000
      - key: USER_TEMPORARY_PASSWORD_TTL_SECONDS
        value: 86400
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Luma Motos
      - key: FRONTEND_URL
        sync: false
